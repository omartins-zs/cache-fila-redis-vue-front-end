services:
  app:
    build: .
    container_name: cfr_front_app
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html

  nginx:
    image: nginx:alpine
    container_name: cfr_front_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
